# Define qual arquivo o servidor deve entregar: {nome}-{perfil}.properties
spring.application.name=cliente-vendas
spring.profiles.active=dev

# Endereco do servidor de configuracao. O prefixo optional: deixa a aplicacao
# subir mesmo com o servidor fora do ar, usando os valores padrao do codigo.
spring.config.import=optional:configserver:http://localhost:8888

management.endpoints.web.exposure.include=*
