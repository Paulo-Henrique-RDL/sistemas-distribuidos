# Banco em memoria exclusivo dos testes.
#
# Os testes nao podem usar o banco em arquivo: eles sujariam os dados reais e o
# resultado passaria a depender do que ja existe no disco. Em memoria, cada
# execucao comeca limpa e o resultado e sempre o mesmo.
spring.datasource.url=jdbc:h2:mem:testes;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
