spring.application.name=monolito
server.port=8080

# Banco H2 gravado em arquivo: os dados sobrevivem ao reinicio da aplicacao.
# AUTO_SERVER permite abrir o console enquanto a aplicacao esta rodando.
spring.datasource.url=jdbc:h2:file:./dados/contas;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria e atualiza as tabelas a partir das entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Como o banco e persistente, um data.sql rodaria a cada inicializacao e
# duplicaria os registros. Os dados entram pela propria API.
spring.sql.init.mode=never

# Console do banco: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Datas no formato ISO (2026-10-06) e sem campos nulos nas respostas.
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
