spring.application.name=pedido-service
server.port=8300

# Banco proprio: pedido e item_pedido. Nao ha tabela de cliente nem de produto
# aqui, e nenhuma chave estrangeira apontando para fora deste arquivo.
spring.datasource.url=jdbc:h2:file:./dados/pedidos;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Enderecos dos servicos de que este depende. Ficam em configuracao, nunca no
# codigo: trocar de ambiente passa a ser trocar uma propriedade.
servicos.cliente.url=http://localhost:8100
servicos.catalogo.url=http://localhost:8200
servicos.timeout-segundos=3

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
