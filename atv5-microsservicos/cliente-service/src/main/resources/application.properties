spring.application.name=cliente-service
server.port=8100

# Banco proprio deste microsservico. Nenhum outro servico acessa este arquivo:
# a comunicacao entre servicos e sempre por HTTP, nunca pelo banco.
spring.datasource.url=jdbc:h2:file:./dados/clientes;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Flyway e o dono do esquema; o Hibernate so confere se as entidades batem
# com as tabelas que as migrations criaram. Deixar o Hibernate criar tabela
# em producao e justamente o que se evita no mercado.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info
spring.jackson.default-property-inclusion=non_null
